<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindForce Grip - Registro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/register.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
  </head>

  <body>
    <button
      type="button"
      class="theme-toggle"
      id="themeToggle"
      aria-label="Cambiar tema"
    >
      <i class="fa-solid fa-moon" id="themeToggleIcon" aria-hidden="true"></i>
    </button>

    <div class="register-container">
      <div class="register-card">
        <div class="logo-container">
          <img src="MindForce Grip-logo.jpg" alt="Logo" class="logo" />
        </div>

        <h1>Registro de Terapeutas</h1>
        <p class="subtitle">
          Alta profesional exclusiva para terapeutas sujeta a revision de
          administracion
        </p>

        <form id="registerForm" class="split-form">
          <div class="form-group full-width">
            <label for="tipo_cuenta">Tipo de Cuenta</label>
            <input type="text" id="tipo_cuenta" value="Terapeuta" readonly />
          </div>

          <div class="form-group">
            <label for="nombres">Nombres</label>
            <input
              type="text"
              id="nombres"
              placeholder="Juan Carlos"
              required
              autocomplete="given-name"
            />
          </div>

          <div class="form-group">
            <label for="apellido_paterno">Apellido Paterno</label>
            <input
              type="text"
              id="apellido_paterno"
              placeholder="Pérez"
              required
              autocomplete="family-name"
            />
          </div>

          <div class="form-group">
            <label for="apellido_materno">Apellido Materno</label>
            <input
              type="text"
              id="apellido_materno"
              placeholder="García"
              required
            />
          </div>

          <div class="form-group">
            <label for="cedula_profesional">Cedula Profesional</label>
            <input
              type="text"
              id="cedula_profesional"
              placeholder="12345678"
              required
              maxlength="8"
              pattern="\d{7,8}"
            />
          </div>

          <div class="form-group">
            <label for="curp">CURP</label>
            <input
              type="text"
              id="curp"
              placeholder="ABCD900101HDFRRL09"
              required
              maxlength="18"
              minlength="18"
            />
          </div>

          <div class="form-group">
            <label for="fecha_nacimiento">Fecha de Nacimiento</label>
            <input type="date" id="fecha_nacimiento" required />
          </div>

          <div class="form-group">
            <label for="telefono">Telefono de Contacto</label>
            <input
              type="tel"
              id="telefono"
              placeholder="5512345678"
              required
              maxlength="10"
              pattern="\d{10}"
            />
          </div>

          <div class="form-group">
            <label for="correo">Correo Profesional</label>
            <input
              type="email"
              id="correo"
              placeholder="terapeuta@clinica.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="especializacion">Especializacion</label>
            <input
              type="text"
              id="especializacion"
              placeholder="Neurorehabilitacion"
              required
            />
          </div>

          <div class="form-group">
            <label for="contrasena">Contraseña</label>
            <div class="password-field">
              <input
                type="password"
                id="contrasena"
                placeholder="Mínimo 10 caracteres"
                minlength="10"
                required
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="Mostrar contraseña"
                aria-pressed="false"
              >
                <i
                  class="fa-solid fa-eye password-toggle-icon"
                  aria-hidden="true"
                ></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmar_contrasena">Confirmar Contraseña</label>
            <div class="password-field">
              <input
                type="password"
                id="confirmar_contrasena"
                placeholder="Repite tu contraseña"
                required
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle"
                id="toggleConfirmPassword"
                aria-label="Mostrar confirmacion de contraseña"
                aria-pressed="false"
              >
                <i
                  class="fa-solid fa-eye password-toggle-icon"
                  aria-hidden="true"
                ></i>
              </button>
            </div>
          </div>

          <label class="consent-checkbox full-width">
            <input type="checkbox" id="consentimiento" required />
            Confirmo aviso de privacidad y autorizo el envio de mis datos para
            revision administrativa.
          </label>

          <p class="form-note full-width">
            Este portal no permite crear cuentas de administrador. Tu solicitud
            sera evaluada por administracion antes de activar tu cuenta de
            terapeuta.
          </p>

          <button type="submit" class="btn-register full-width">
            Solicitar Alta de Terapeuta
          </button>
        </form>

        <div class="welcome-message" id="welcomeMessage"></div>
        <div class="error-message" id="errorMessage"></div>

        <div class="divider"></div>

        <div class="footer-link">
          ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
        </div>
      </div>
    </div>

    <script src="js/web-state-store.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
